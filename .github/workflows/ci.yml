# 说明：仅使用官方 actions，全部为 node24 版本（v7）——自托管 runner 需 >= 2.327.1；
# 若 runner 版本较旧，把 checkout@v7 / setup-python@v7 / upload-artifact@v7
# 分别降级为 @v4 / @v5 / @v4 即可。
#
# 触发方式：仅在打 tag（v*）时运行。CI 编译静态链接的 Linux Rust 可执行文件（musl、非 PIE）
# 并打包 Python wheel：产物既在对应 workflow run 的 Artifacts 中下载，也会作为附件
# 自动发布到同名的 GitHub Release；日常 push / PR 不触发。
# 如需手动触发，加上 workflow_dispatch 即可。

name: CI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust 采集器：测试 + lint + 编译 Linux 可执行文件 ──────────────────
  rust-linux:
    name: Rust collector (Linux x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cargo.toml 要求 rust-version >= 1.85（clap / indexmap 等依赖使用 edition 2024）
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # 目标系统最低为 CentOS 6.8（glibc 2.12），而 Rust 标准库的 x86_64-unknown-linux-gnu 目标
      # 自 Rust 1.64 起要求 glibc >= 2.17，因此对外产物改用 musl 静态链接：
      # 不依赖任何 glibc 版本，CentOS 6.8 / 7 / 8 / 9、Debian、Ubuntu 均可直接运行。
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          musl-gcc --version

      - name: Build static binary (musl, non-PIE)
        # -C relocation-model=static：产出传统 ET_EXEC 静态可执行文件（而非 static-pie），
        # 避开极老内核/发行版加载 PIE 主程序的兼容性风险；代价是该二进制无 ASLR 随机化。
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: "-C relocation-model=static"

      - name: Verify binary is static and non-PIE
        working-directory: collector/rust
        run: |
          bin=target/x86_64-unknown-linux-musl/release/eda-license-collector
          file "$bin"
          elf_type=$(readelf -h "$bin" | awk '/Type:/ {print $2}')
          needed=$(readelf -d "$bin" | grep -c '(NEEDED)' || true)
          echo "ELF type: $elf_type, DT_NEEDED entries: $needed"
          test "$elf_type" = "EXEC"   # 非 PIE：老内核/老发行版加载兼容性最好
          test "$needed" -eq 0        # 完全静态：不依赖 glibc（CentOS 6.8 为 glibc 2.12）
          "$bin" --version

      - name: Upload static Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: eda-license-collector-linux-x86_64-static
          path: collector/rust/target/x86_64-unknown-linux-musl/release/eda-license-collector
          if-no-files-found: error

  # ── Python 采集器：打包 wheel ────────────────────────────────────────
  python-wheel:
    name: Python collector wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel collector/python

      - name: Smoke test wheel in clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet collector/python/dist/*.whl
          cd "$RUNNER_TEMP"   # 离开仓库目录，确保只依赖 wheel 内的文件
          "$RUNNER_TEMP/venv/bin/eda-license-collector" --help
          "$RUNNER_TEMP/venv/bin/python" -c "import lmutil_parser, prometheus_exporter; print('imports OK')"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel
          path: collector/python/dist/*.whl
          if-no-files-found: error

  # ── 打 tag 时创建 GitHub Release，并把产物作为附件上传 ──────────────
  release:
    name: GitHub Release
    needs: [rust-linux, python-wheel]
    runs-on: ubuntu-latest
    # 顶部 permissions 是只读，创建 Release 需要给本 job 单独开写权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 下载前面两个 job 上传的 artifact，zip 会被自动解包，得到原始文件
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Package release assets
        run: |
          mkdir -p staging release
          cp dist/eda-license-collector-linux-x86_64-static/eda-license-collector staging/
          cp collector/rust/README.md staging/
          chmod +x staging/eda-license-collector
          # 打成 tar.gz：HTTP 下载不保留可执行位，解包后权限自带 +x
          tar -czf "release/eda-license-collector-${GITHUB_REF_NAME}-linux-x86_64-static.tar.gz" -C staging .
          cp dist/python-wheel/*.whl release/
          ls -l release

      # gh 已预装在 GitHub runner 上，用 GITHUB_TOKEN 直接创建 Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release/*

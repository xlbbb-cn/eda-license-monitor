# 说明：仅使用官方 actions，全部为 node24 版本（v7）——自托管 runner 需 >= 2.327.1；
# 若 runner 版本较旧，把 checkout@v7 / setup-python@v7 / upload-artifact@v7
# 分别降级为 @v4 / @v5 / @v4 即可。
#
# 触发方式：仅在打 tag（v*）时运行。CI 编译 Linux Rust 可执行文件并打包 Python wheel，
# 产物在对应 workflow run 的 Artifacts 中下载；日常 push / PR 不触发。
# 如需手动触发，加上 workflow_dispatch 即可。

name: CI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust 采集器：测试 + lint + 编译 Linux 可执行文件 ──────────────────
  rust-linux:
    name: Rust collector (Linux x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cargo.toml 要求 rust-version >= 1.85（clap / indexmap 等依赖使用 edition 2024）
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # 产物为动态链接 glibc 的 x86_64 二进制；如需完全静态可改为
      # musl 目标：rustup target add x86_64-unknown-linux-musl
      #          cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test binary
        run: ./target/release/eda-license-collector --version

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: eda-license-collector-linux-x86_64
          path: collector/rust/target/release/eda-license-collector
          if-no-files-found: error

  # ── Python 采集器：打包 wheel ────────────────────────────────────────
  python-wheel:
    name: Python collector wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel collector/python

      - name: Smoke test wheel in clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet collector/python/dist/*.whl
          cd "$RUNNER_TEMP"   # 离开仓库目录，确保只依赖 wheel 内的文件
          "$RUNNER_TEMP/venv/bin/eda-license-collector" --help
          "$RUNNER_TEMP/venv/bin/python" -c "import lmutil_parser, prometheus_exporter; print('imports OK')"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel
          path: collector/python/dist/*.whl
          if-no-files-found: error

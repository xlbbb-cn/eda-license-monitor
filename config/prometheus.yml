global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "alert_rules.yaml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "flexlm"
    scrape_interval: 30s
    static_configs:
      - targets: ["collector:9091"]
        labels:
          env: "production"
